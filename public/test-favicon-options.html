<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #FAF8F5; font-family: sans-serif; padding: 20px; }
  .grid { display: flex; gap: 30px; flex-wrap: wrap; }
  .card { background: white; padding: 15px; border-radius: 8px; border: 1px solid #ccc; text-align: center; }
  svg { width: 120px; height: 120px; }
</style>
</head>
<body>
<div class='grid'>
  <!-- Candidate 1: Dynamic Cotyledon Crescent Geometry -->
  <div class='card'>
    <h4>Option 1: Curved Bean Cotyledons</h4>
    <svg viewBox='0 0 200 240' fill='none'>
      <!-- Blue Cotyledon (Top-Left) -->
      <path d='M 112 18 C 96 18, 62 42, 46 82 C 30 122, 36 160, 60 190 C 74 208, 92 210, 102 200 C 110 190, 106 174, 98 160 C 86 138, 86 112, 98 88 C 106 72, 114 50, 116 32 C 116 24, 116 18, 112 18 Z' fill='#5584B4' />
      
      <!-- Grey Cotyledon (Bottom-Right, 180° rotated) -->
      <path d='M 112 18 C 96 18, 62 42, 46 82 C 30 122, 36 160, 60 190 C 74 208, 92 210, 102 200 C 110 190, 106 174, 98 160 C 86 138, 86 112, 98 88 C 106 72, 114 50, 116 32 C 116 24, 116 18, 112 18 Z' fill='#D0D5DB' transform='rotate(180 100 120)' />
      
      <!-- Center Sprout (Green Leaf) -->
      <path d='M 100 82 C 114 98, 114 142, 100 158 C 86 142, 86 98, 100 82 Z' fill='#8EC027' />
    </svg>
  </div>

  <!-- Candidate 2: Elegant Kidney Bean Sprout Geometry -->
  <div class='card'>
    <h4>Option 2: Kidney Bean Cotyledons</h4>
    <svg viewBox='0 0 200 240' fill='none'>
      <!-- Blue Cotyledon (Top-Left) -->
      <path d='M 108 20 C 88 20, 56 46, 42 88 C 28 130, 36 166, 62 192 C 78 208, 94 204, 100 194 C 104 186, 100 172, 92 156 C 80 132, 82 108, 96 82 C 106 64, 112 44, 112 28 C 112 22, 112 20, 108 20 Z' fill='#5584B4' />
      
      <!-- Grey Cotyledon (Bottom-Right, 180° rotated) -->
      <path d='M 108 20 C 88 20, 56 46, 42 88 C 28 130, 36 166, 62 192 C 78 208, 94 204, 100 194 C 104 186, 100 172, 92 156 C 80 132, 82 108, 96 82 C 106 64, 112 44, 112 28 C 112 22, 112 20, 108 20 Z' fill='#C8CED5' transform='rotate(180 100 120)' />
      
      <!-- Center Sprout -->
      <path d='M 100 80 C 116 100, 116 140, 100 160 C 84 140, 84 100, 100 80 Z' fill='#8EC027' />
    </svg>
  </div>

  <!-- Candidate 3: Droplet / Paisley Style -->
  <div class='card'>
    <h4>Option 3: Paisley Droplet</h4>
    <svg viewBox='0 0 200 240' fill='none'>
      <!-- Blue Drop (Top-Left) -->
      <path d='M 105 16 C 90 20, 60 48, 48 88 C 34 132, 44 170, 72 196 C 86 208, 98 202, 104 190 C 108 180, 102 166, 94 150 C 82 126, 84 102, 98 76 C 108 58, 114 38, 112 24 C 110 18, 108 16, 105 16 Z' fill='#5584B4' />
      
      <!-- Grey Drop (Bottom-Right, 180° rotated) -->
      <path d='M 105 16 C 90 20, 60 48, 48 88 C 34 132, 44 170, 72 196 C 86 208, 98 202, 104 190 C 108 180, 102 166, 94 150 C 82 126, 84 102, 98 76 C 108 58, 114 38, 112 24 C 110 18, 108 16, 105 16 Z' fill='#D5D8DC' transform='rotate(180 100 120)' />
      
      <!-- Center Sprout -->
      <path d='M 100 78 C 116 98, 116 142, 100 162 C 84 142, 84 98, 100 78 Z' fill='#8EC027' />
    </svg>
  </div>
</div>
</body>
</html>
