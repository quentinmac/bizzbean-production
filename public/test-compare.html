<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;300;400&display=swap" rel="stylesheet">
<style>
  body { background: #FAF8F5; margin: 40px; font-family: 'Raleway', sans-serif; }
  .header-test { display: flex; align-items: center; gap: 8px; margin-bottom: 30px; }
  .logo-text { font-size: 48px; color: #707070; display: inline-flex; align-items: baseline; letter-spacing: -1px; }
  .bizz { font-weight: 300; }
  .bean { font-weight: 100; }
  .tm { font-size: 11px; vertical-align: super; font-weight: 300; margin-left: 2px; }
</style>
</head>
<body>
  <h2>Comparison with Ole Website Header:</h2>
  <div class="header-test">
    <img src="/bizzbean favicon.jpg" width="46" height="55" style="mix-blend-mode: multiply;" />
    <span class="logo-text"><span class="bizz">bizz</span><span class="bean">bean</span><span class="tm">TM</span></span>
  </div>
</body>
</html>
