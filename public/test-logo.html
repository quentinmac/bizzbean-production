<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  body { background: #FAF8F5; margin: 40px; font-family: 'Raleway', sans-serif; }
  .seam-preview { display: flex; align-items: baseline; justify-content: center; position: relative; margin: 20px 0; }
  .left-half { display: flex; align-items: baseline; justify-content: flex-end; border-right: 1px dashed #e2e8f0; padding-right: 1px; }
  .right-half { display: flex; align-items: baseline; justify-content: flex-start; padding-left: 1px; }
  .bizz { font-weight: 300; font-size: 64px; color: #707070; letter-spacing: -1px; }
  .bean { font-weight: 100; font-size: 64px; color: #707070; letter-spacing: -1px; }
  .tm { font-size: 14px; font-weight: 300; vertical-align: super; margin-left: 2px; }
</style>
</head>
<body>
  <h2>Bizzbean Logo Preview (Light + Thin, No Full Stop):</h2>
  <div class="seam-preview">
    <div class="left-half"><span class="bizz">bizz</span></div>
    <div class="right-half"><span class="bean">bean<span class="tm">TM</span></span></div>
  </div>
</body>
</html>
