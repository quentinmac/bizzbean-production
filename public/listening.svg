<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='500' viewBox='0 0 1200 500'>
  <defs>
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0B0F19' />
      <stop offset='40%' stop-color='#12172A' />
      <stop offset='100%' stop-color='#19233C' />
    </linearGradient>
    <linearGradient id='glowGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#5584B4' stop-opacity='0.1' />
      <stop offset='50%' stop-color='#5584B4' stop-opacity='0.4' />
      <stop offset='100%' stop-color='#D4A373' stop-opacity='0.1' />
    </linearGradient>
    <linearGradient id='waveGrad1' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#5584B4' />
      <stop offset='50%' stop-color='#93C5FD' />
      <stop offset='100%' stop-color='#D4A373' />
    </linearGradient>
    <radialGradient id='pulseGlow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#5584B4' stop-opacity='0.25' />
      <stop offset='100%' stop-color='#12172A' stop-opacity='0' />
    </radialGradient>
  </defs>

  <!-- Deep Background -->
  <rect width='1200' height='500' fill='url(#bgGrad)' />

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke='#252E4A' stroke-width='0.75' opacity='0.3'>
    <line x1='0' y1='100' x2='1200' y2='100' />
    <line x1='0' y1='200' x2='1200' y2='200' />
    <line x1='0' y1='300' x2='1200' y2='300' />
    <line x1='0' y1='400' x2='1200' y2='400' />
    <line x1='300' y1='0' x2='300' y2='500' />
    <line x1='600' y1='0' x2='600' y2='500' />
    <line x1='900' y1='0' x2='900' y2='500' />
  </g>

  <!-- Central Ambient Glow -->
  <circle cx='600' cy='240' r='220' fill='url(#pulseGlow)' />

  <!-- Geometric Soundwave / Dialogue Energy Visualizer -->
  <g fill='none' stroke='url(#waveGrad1)' stroke-linecap='round'>
    <!-- Left Waveform -->
    <line x1='240' y1='230' x2='240' y2='250' stroke-width='3' opacity='0.4' />
    <line x1='280' y1='215' x2='280' y2='265' stroke-width='3' opacity='0.5' />
    <line x1='320' y1='195' x2='320' y2='285' stroke-width='3.5' opacity='0.6' />
    <line x1='360' y1='170' x2='360' y2='310' stroke-width='4' opacity='0.75' />
    <line x1='400' y1='145' x2='400' y2='335' stroke-width='4' opacity='0.85' />
    <line x1='440' y1='185' x2='440' y2='295' stroke-width='4' opacity='0.7' />
    <line x1='480' y1='130' x2='480' y2='350' stroke-width='4.5' opacity='0.9' />
    <line x1='520' y1='165' x2='520' y2='315' stroke-width='4.5' opacity='0.8' />
    <line x1='560' y1='110' x2='560' y2='370' stroke-width='5' opacity='0.95' />
    
    <!-- Center Socratic Core Node -->
    <line x1='600' y1='90' x2='600' y2='390' stroke-width='5.5' opacity='1' stroke='#D4A373' />
    
    <!-- Right Waveform -->
    <line x1='640' y1='110' x2='640' y2='370' stroke-width='5' opacity='0.95' />
    <line x1='680' y1='165' x2='680' y2='315' stroke-width='4.5' opacity='0.8' />
    <line x1='720' y1='130' x2='720' y2='350' stroke-width='4.5' opacity='0.9' />
    <line x1='760' y1='185' x2='760' y2='295' stroke-width='4' opacity='0.7' />
    <line x1='800' y1='145' x2='800' y2='335' stroke-width='4' opacity='0.85' />
    <line x1='840' y1='170' x2='840' y2='310' stroke-width='4' opacity='0.75' />
    <line x1='880' y1='195' x2='880' y2='285' stroke-width='3.5' opacity='0.6' />
    <line x1='920' y1='215' x2='920' y2='265' stroke-width='3' opacity='0.5' />
    <line x1='960' y1='230' x2='960' y2='250' stroke-width='3' opacity='0.4' />
  </g>

  <!-- Glowing Listening Waves (Radiating arcs) -->
  <g fill='none' stroke='#5584B4' stroke-width='1.5' opacity='0.3'>
    <circle cx='600' cy='240' r='140' stroke-dasharray='6, 6' />
    <circle cx='600' cy='240' r='190' stroke-dasharray='8, 8' opacity='0.2' />
  </g>

  <!-- Center Status Badge -->
  <g transform='translate(600, 440)'>
    <rect x='-170' y='-22' width='340' height='40' rx='20' fill='#161C30' stroke='#5584B4' stroke-width='1.5' />
    <circle cx='-135' cy='-2' r='5' fill='#5584B4' />
    <text x='-115' y='3' fill='#FFFFFF' font-family='system-ui, -apple-system, sans-serif' font-size='13' font-weight='700' letter-spacing='2'>COACH GIM IS LISTENING</text>
  </g>

  <!-- Small Top Indicator -->
  <text x='600' y='55' fill='#D4A373' font-family='monospace' font-size='11' font-weight='600' letter-spacing='3' text-anchor='middle'>SOCRATIC ENGAGEMENT LOOP · V1 PROCESS</text>
</svg>