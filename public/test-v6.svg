<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <rect width="200" height="200" fill="white" />
  
  <!-- Center Green Leaf -->
  <path
    d="M 100 68
       C 80 82, 80 118, 100 132
       C 120 118, 120 82, 100 68 Z"
    fill="#94BD16"
  />
  
  <g fill="none" stroke-width="26">
    <!-- Blue Ribbon (Top-Left) -->
    <!-- Flat cap at top start, round cap at bottom end -->
    <path
      d="M 100 20
         L 58 62
         C 42 78, 36 94, 36 112
         L 36 122
         C 36 142, 46 160, 68 174"
      stroke="#5584B4"
      stroke-linecap="round"
    />

    <!-- Grey Ribbon (Bottom-Right, 180 deg rotation) -->
    <path
      d="M 100 20
         L 58 62
         C 42 78, 36 94, 36 112
         L 36 122
         C 36 142, 46 160, 68 174"
      stroke="#D5D8DD"
      stroke-linecap="round"
      transform="rotate(180 100 100)"
    />
  </g>
</svg>